<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" role="img" aria-label="Anmon - developer from Ulaanbaatar, building CUPOST at Premium Nexus">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"><animate attributeName="seed" values="3;7;11;5;9" dur=".6s" calcMode="discrete" repeatCount="indefinite"/></feTurbulence><feColorMatrix type="saturate" values="0"/></filter>
  <clipPath id="band"><rect x="0" y="40" width="900" height="140"/></clipPath>
</defs>
<style>
  .L{font:400 124px Georgia,'Times New Roman',Times,serif;fill:#f5f5f5;text-anchor:middle;transform-box:fill-box;transform-origin:center;transform:translateY(150px);animation:rise 1.1s cubic-bezier(.16,.8,.2,1) forwards}
  @keyframes rise{to{transform:translateY(0)}}
  .T{font:400 11px 'SF Mono','Fira Code',Menlo,Consolas,monospace;letter-spacing:5px;fill:#a3a3a3;text-anchor:middle;opacity:0;animation:fade 1.2s ease 1.5s forwards}
  .N{font:italic 15px Georgia,'Times New Roman',Times,serif;fill:#d4d4d4;text-anchor:middle;opacity:0;animation:fade 1.2s ease 2s forwards}
  @keyframes fade{to{opacity:1}}
  .ink{fill:none;stroke:#f5f5f5;stroke-linecap:round;stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.4s cubic-bezier(.4,0,.2,1) 1.1s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
</style>
<rect width="900" height="260" fill="#050505"/>
<g clip-path="url(#band)"><text x="292.5" y="152" class="L" style="animation-delay:0.40s">A</text><text x="370.5" y="152" class="L" style="animation-delay:0.53s">n</text><text x="459.5" y="152" class="L" style="animation-delay:0.66s">m</text><text x="547" y="152" class="L" style="animation-delay:0.79s">o</text><text x="615.5" y="152" class="L" style="animation-delay:0.92s">n</text></g>
<path class="ink" stroke-width="2.2" d="M262 184 C 340 176, 470 190, 640 180"/>
<path class="ink" stroke-width="1" style="animation-delay:1.5s" d="M300 191 C 400 187, 520 194, 600 189"/>
<g class="T"><text x="450" y="30" class="T">FULL-STACK · HEALTHCARE · BUILDER</text></g>
<text x="450" y="228" class="N">currently building CUPOST at Premium Nexus</text>
<circle cx="280" cy="223" r="3" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;1;.25;1" dur="2s" begin="2.2s" repeatCount="indefinite"/></circle>
<rect width="900" height="260" filter="url(#grain)" opacity=".09"/>
<rect x="10.5" y="10.5" width="879" height="239" fill="none" stroke="#fff" stroke-opacity=".18"/>
</svg>